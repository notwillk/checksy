name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run quality checks in devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: >-
            test "${GITHUB_ACTIONS:-}" = true &&
            test "$(uname -m)" = x86_64 &&
            rulesy --config=.devcontainer/rulesy.yaml check --fix --non-interactive &&
            rulesy --config=.devcontainer/rulesy.yaml check --non-interactive &&
            test ! -e "$HOME/.local/opt/codex-cli/bin/codex" &&
            test ! -L "$HOME/.local/opt/codex-cli/bin/codex" &&
            test "$(moon --version)" = "moon 2.4.5" &&
            test "$(moonx --version)" = "moon-exec 2.4.5" &&
            bash -o pipefail -c "find .devcontainer/scripts .github/scripts scripts products/rulesy/scripts devcontainer-features -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n" &&
            bash .devcontainer/scripts/tests/run.sh &&
            bash products/rulesy/scripts/tests/verify-static-linux-binary.sh &&
            bash products/rulesy/scripts/tests/release-portability.sh &&
            moon run rulesy:format &&
            moon run rulesy:lint &&
            sh -n scripts/install.sh &&
            sh -n scripts/uninstall.sh &&
            moon run rulesy-devcontainer-feature:build &&
            moon run rulesy-devcontainer-feature:lint &&
            moon run rulesy-devcontainer-feature:test

  devcontainer-arm:
    name: Devcontainer bootstrap (arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build and verify the ARM64 devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          runCmd: >-
            test "$(uname -m)" = aarch64 &&
            test "$(rulesy --version)" = "rulesy 0.8.1" &&
            test "$(moon --version)" = "moon 2.4.5" &&
            test "$(moonx --version)" = "moon-exec 2.4.5" &&
            rulesy --config=.devcontainer/rulesy.yaml check --non-interactive

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Install Moon
        run: bash .github/scripts/install-moon.sh

      - name: Verify Moon version
        run: |
          test "$(moon --version)" = "moon 2.4.5"
          test "$(moonx --version)" = "moon-exec 2.4.5"

      - name: Build Rulesy
        run: moon run rulesy:build

      - name: Test Rulesy
        run: moon run rulesy:test

  portability-build:
    name: Portable Linux build (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Moon
        run: bash .github/scripts/install-moon.sh

      - name: Build portable Linux release
        env:
          RULESY_TARGET: ${{ matrix.target }}
        run: moon run rulesy:cross-compile -- "$RULESY_TARGET"

      - name: Upload portable Linux release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rulesy-linux-${{ matrix.arch }}
          path: products/rulesy/dist/rulesy_linux_${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  portability-smoke:
    name: Portable Linux smoke (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    needs: portability-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download portable Linux release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rulesy-linux-${{ matrix.arch }}
          path: products/rulesy/dist

      - name: Verify and run portable Linux release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p products/rulesy/dist/smoke
          tar -xzf "products/rulesy/dist/rulesy_linux_${{ matrix.arch }}.tar.gz" -C products/rulesy/dist/smoke
          expected_version="$(sed -n 's/^pub const VERSION: &str = "\(.*\)";$/\1/p' products/rulesy/src/version.rs)"
          test -n "$expected_version"
          ./products/rulesy/scripts/verify-static-linux-binary.sh products/rulesy/dist/smoke/rulesy "$expected_version"
          smoke_config="$(mktemp)"
          trap 'rm -f "$smoke_config"' EXIT
          printf 'rules:\n  - name: static release smoke\n    check: test "$(uname -s)" = Linux\n' >"$smoke_config"
          products/rulesy/dist/smoke/rulesy --config="$smoke_config" check --fix --non-interactive
